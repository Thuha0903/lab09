services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      - product-service
      - order-service

  product-service:
    build: ./product-service
    environment:
      - VERSION=v1

  order-service:
    build: ./order-service
    environment:
      - PRODUCT_URL=http://product-service:5000
    # restart: always